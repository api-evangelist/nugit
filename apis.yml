x-status-note: 'Nugit was a Singapore-based data-storytelling / marketing-analytics
  startup (500 Global portfolio). Re-probed 2026-08-13 and the finding is unchanged
  and worse: https://nugit.co/ returns 200 with an Indonesian online-gambling page
  (ALEXISTOGEL) whose own canonical tag points at thewhiskyardvark.com — a hijacked
  domain running an SEO doorway network. https://www.nugit.co/ 200s after redirecting
  cross-site to ford-koenig-heiligenstadt.de. nugit.io is listed for sale on
  domains.atom.com; api./docs./developer./app.nugit.co do not resolve at all. Every
  contract-discovery and .well-known path on nugit.co 404s from the squatter''s
  server. The Website pointer to nugit.co was REMOVED on 2026-08-13 so the catalog
  stops sending readers to a gambling/spam site under Nugit''s name. Do not restore
  it. The only verified first-party surface left is github.com/nugit (200, "Nugit
  Engineering", 45 public repos, org created 2013-07-15, last substantive activity
  2023) — 45 repos, none of which publish an API contract or client library. Domain
  and DNS security probing was deliberately NOT run: nugit.co is no longer under
  Nugit''s control, so its TLS/SPF/DMARC/CAA posture belongs to the squatter and
  recording it would misattribute a third party''s configuration to this company.'
