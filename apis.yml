name: Nugit
description: 'Nugit was a Singapore-based data-storytelling and marketing-analytics
  company, founded in 2013 and backed by 500 Global. Its product pulled marketing,
  advertising and web-analytics data from multiple sources and used natural language
  generation to turn it into automated narrative reports and visual "data stories"
  for brand and agency teams. Nugit never published a public developer API, portal,
  reference or machine-readable specification, and the company is now defunct: the
  nugit.co domain has been lost to an unrelated registrant and serves an online
  gambling / SEO-spam site. The only surviving first-party surface is the dormant
  github.com/nugit engineering organization.'
